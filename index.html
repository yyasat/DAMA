<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DAMA — 打码神器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:         #0B0906;
            --panel:      rgba(11, 9, 6, 0.96);
            --surface:    #161210;
            --text:       #EDE6D6;
            --muted:      #5C5348;
            --muted2:     #918880;
            --gold:       #C9A96C;
            --gold-dim:   rgba(201, 169, 108, 0.12);
            --gold-edge:  rgba(201, 169, 108, 0.22);
            --danger:     #C94B42;
            --nav-h:      68px;
        }

        /* ── 日间模式变量 ── */
        [data-theme="light"] {
            --bg:        #F5F0E8;
            --panel:     rgba(245, 240, 232, 0.96);
            --surface:   #EDE6D6;
            --text:      #1C1410;
            --muted:     #A09080;
            --muted2:    #6E5E50;
            --gold:      #9A6820;
            --gold-dim:  rgba(154, 104, 32, 0.12);
            --gold-edge: rgba(154, 104, 32, 0.28);
            --danger:    #C94B42;
        }
        [data-theme="light"] canvas { box-shadow: 0 12px 60px rgba(0,0,0,0.15); }
        [data-theme="light"] .sq-btn { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .mode-row { border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .m-tab { border-right-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .theme-row { border-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .t-btn { border-right-color: rgba(0,0,0,0.1); }
        [data-theme="light"] .export-bar-wrap { background: rgba(0,0,0,0.1); }
        [data-theme="light"] input[type="range"] { background: rgba(0,0,0,0.15); }
        [data-theme="light"] .toast { background: rgba(245,240,232,0.95); }
        [data-theme="light"] .export-overlay { background: rgba(245,240,232,0.88); }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw; height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Jost', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        input[type="file"] { display: none; }
        button { cursor: pointer; }

        /* ══════════════════════════════
           TOP NAV
        ══════════════════════════════ */
        .top-nav {
            flex-shrink: 0;
            height: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
            padding: env(safe-area-inset-top, 0px) 22px 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            background: var(--panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--gold-edge);
            z-index: 200;
        }

        .nav-wing {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 15px;
            min-width: 90px;
        }
        .nav-wing.right { justify-content: flex-end; }

        .nav-pill {
            background: none; border: none;
            font-family: 'Jost', sans-serif;
            font-size: 10px; font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            padding: 5px 0;
        }
        .nav-pill:active { opacity: 0.5; }
        .nav-pill.dim { color: var(--muted2); }
        .nav-pill.dim:hover { color: var(--gold); }

        .nav-core {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding-bottom: 11px;
        }

        .brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 300;
            font-size: 24px;
            letter-spacing: 0.1em;
            color: var(--text);
            line-height: 1;
        }

        /* image counter row */
        .img-nav {
            display: none;
            align-items: center;
            gap: 12px;
        }
        .img-nav.on { display: flex; }

        .pg-btn {
            background: none; border: none;
            color: var(--gold); font-size: 20px;
            width: 24px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            padding: 0; line-height: 1; font-weight: 200;
        }
        .pg-btn:disabled { opacity: 0.18; cursor: default; }

        .pg-count {
            font-size: 10px;
            letter-spacing: 0.18em;
            color: var(--muted2);
            min-width: 48px;
            text-align: center;
        }

        /* ══════════════════════════════
           WORKSPACE
        ══════════════════════════════ */
        .workspace {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 0 320px;
        }

        /* empty state */
        .empty-wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -58%);
            text-align: center;
            pointer-events: none;
        }
        .empty-ring {
            width: 60px; height: 60px;
            border: 1px solid var(--gold-edge);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            color: var(--gold);
            font-size: 18px;
        }
        .empty-h {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 20px;
            color: var(--muted2);
            margin-bottom: 8px;
        }
        .empty-s {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        canvas {
            display: none;
            max-width: 100%;
            height: auto;
            box-shadow: 0 12px 60px rgba(0,0,0,0.8);
        }

        /* ── 画布容器 & 禁止层叠加 ── */
        .canvas-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            line-height: 0;
        }
        #zone-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        /* ── 禁止层信息行 ── */
        .zone-info-row {
            display: none;
            align-items: center;
            gap: 10px;
        }
        .zone-tip {
            font-size: 9px;
            letter-spacing: 0.10em;
            color: var(--muted);
            flex: 1;
        }
        .zone-count-badge {
            font-size: 9px;
            letter-spacing: 0.12em;
            color: var(--gold);
            background: var(--gold-dim);
            border: 1px solid var(--gold-edge);
            padding: 2px 8px;
            border-radius: 1px;
            white-space: nowrap;
        }
        .zone-clear-btn {
            background: none; border: none;
            font-family: 'Jost', sans-serif;
            font-size: 9px; font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--danger);
            padding: 0;
            white-space: nowrap;
            transition: opacity 0.15s;
        }
        .zone-clear-btn:hover { opacity: 0.65; }

        /* ══════════════════════════════
           BOTTOM BAR
        ══════════════════════════════ */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--panel);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--gold-edge);
            padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px)) 18px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* undo/redo */
        .row { display: flex; align-items: stretch; gap: 9px; justify-content: flex-end; }

        .icon-row { display: flex; gap: 8px; }
        .sq-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            color: var(--text);
            width: 42px;
            border-radius: 1px;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
        }
        .sq-btn:disabled { opacity: 0.18; cursor: default; }

        /* Row B: mode tabs */
        .mode-row {
            display: flex;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 1px;
            overflow: hidden;
        }
        .m-tab {
            flex: 1;
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.07);
            color: var(--muted2);
            font-family: 'Jost', sans-serif;
            font-size: 10px; font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 10px 0;
            transition: all 0.15s;
        }
        .m-tab:last-child { border-right: none; }
        .m-tab.active {
            background: var(--gold-dim);
            color: var(--gold);
        }

        /* Row C: blur slider + watermark */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .s-label {
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }
        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 1px;
            background: rgba(255,255,255,0.12);
            outline: none;
            border-radius: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(201,169,108,0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 13px; height: 13px;
            background: var(--gold);
            border: none; border-radius: 50%;
            cursor: pointer;
        }
        .wm-btn {
            background: none; border: none;
            font-family: 'Jost', sans-serif;
            font-size: 9px; font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted2);
            white-space: nowrap;
            padding: 0;
            transition: color 0.15s;
        }
        .wm-btn:hover { color: var(--gold); }

        /* ── 主题切换行 ── */
        .theme-row {
            display: flex;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 1px;
            overflow: hidden;
        }
        .t-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.07);
            color: var(--muted2);
            font-family: 'Jost', sans-serif;
            font-size: 10px; font-weight: 500;
            letter-spacing: 0.08em;
            padding: 9px 0;
            transition: all 0.15s;
        }
        .t-btn:last-child { border-right: none; }
        .t-btn.active { background: var(--gold-dim); color: var(--gold); }

        /* ══════════════════════════════
           TOAST
        ══════════════════════════════ */
        .toast {
            position: fixed;
            top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 14px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 9, 6, 0.93);
            border: 1px solid var(--gold-edge);
            color: var(--text);
            padding: 8px 18px;
            font-size: 11px;
            letter-spacing: 0.07em;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        /* ══════════════════════════════
           EXPORT PROGRESS OVERLAY
        ══════════════════════════════ */
        .export-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(11,9,6,0.85);
            backdrop-filter: blur(12px);
            z-index: 500;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .export-overlay.show { display: flex; }
        .export-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 22px;
            color: var(--text);
        }
        .export-bar-wrap {
            width: 200px;
            height: 1px;
            background: rgba(255,255,255,0.1);
            position: relative;
        }
        .export-bar-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.3s;
        }
        .export-sub {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted2);
        }
    </style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-nav">
    <div class="nav-wing">
        <label class="nav-pill">
            <input type="file" id="upload" accept="image/*" multiple>
            ＋ 导入
        </label>
    </div>

    <div class="nav-core">
        <span class="brand">打码神器</span>
        <div id="img-nav" class="img-nav">
            <button id="btn-prev" class="pg-btn" onclick="prevImage()">‹</button>
            <span id="img-counter" class="pg-count">01 / 01</span>
            <button id="btn-next" class="pg-btn" onclick="nextImage()">›</button>
        </div>
    </div>

    <div class="nav-wing right">
        <button id="btn-export-all" class="nav-pill dim" onclick="exportAll()" style="display:none;">全部导出</button>
        <button class="nav-pill" onclick="exportImage()">导出</button>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- EXPORT OVERLAY -->
<div id="export-overlay" class="export-overlay">
    <div class="export-title">正在打包导出…</div>
    <div class="export-bar-wrap">
        <div id="export-bar" class="export-bar-fill"></div>
    </div>
    <div id="export-sub" class="export-sub">0 / 0</div>
</div>

<!-- WORKSPACE -->
<div class="workspace" id="workspace">
    <div class="empty-wrap" id="empty-state">
        <div class="empty-ring">✦</div>
        <div class="empty-h">还没有照片</div>
        <div class="empty-s">点击左上角导入</div>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <svg id="zone-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
    <div class="row">
        <div class="icon-row">
            <button class="sq-btn" id="btn-undo" onclick="undo()" disabled>↩</button>
            <button class="sq-btn" id="btn-redo" onclick="redo()" disabled>↪</button>
        </div>
    </div>

    <div class="mode-row">
        <button class="m-tab active" id="mode-pan"   onclick="switchMode('pan')">浏览</button>
        <button class="m-tab"        id="mode-box"   onclick="switchMode('box')">拉框打码</button>
        <button class="m-tab"        id="mode-brush" onclick="switchMode('brush')">涂抹打码</button>
        <button class="m-tab"        id="mode-zone"  onclick="switchMode('zone')">禁止层</button>
    </div>

    <div class="slider-row">
        <span class="s-label">模糊强度</span>
        <input type="range" id="blur-radius" min="5" max="40" value="18">
        <button class="wm-btn" onclick="applyWatermark()">全屏水印</button>
    </div>

    <div class="zone-info-row" id="zone-info-row">
        <span class="zone-tip" id="zone-tip">空白处拖拽新增 · 拖拽层移动 · 点击删除</span>拖动新增 · 点击已有层删除</span>
        <span class="zone-count-badge" id="zone-count">0 个禁止层</span>
        <button class="zone-clear-btn" onclick="clearZones()">全部清除</button>
    </div>

    <div class="theme-row">
        <button class="t-btn" id="t-dark"   onclick="setTheme('dark')">🌙 夜间</button>
        <button class="t-btn" id="t-light"  onclick="setTheme('light')">☀️ 日间</button>
        <button class="t-btn" id="t-system" onclick="setTheme('system')">跟随系统</button>
    </div>
</div>

<script>
    /* ── 主题切换 ── */
    const _mq = window.matchMedia('(prefers-color-scheme: light)');
    let _currentTheme = 'dark';

    function applyScheme(scheme) {
        if (scheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
    }

    function setTheme(theme) {
        _currentTheme = theme;
        ['dark','light','system'].forEach(t => {
            const el = document.getElementById('t-' + t);
            if (el) el.classList.toggle('active', t === theme);
        });
        try { localStorage.setItem('dama_theme', theme); } catch(e) {}
        applyScheme(theme === 'system' ? (_mq.matches ? 'light' : 'dark') : theme);
    }

    _mq.addEventListener('change', e => {
        if (_currentTheme === 'system') applyScheme(e.matches ? 'light' : 'dark');
    });

    // 初始化主题（页面加载时读取上次设置）
    (function() {
        let saved = 'dark';
        try { saved = localStorage.getItem('dama_theme') || 'dark'; } catch(e) {}
        setTheme(saved);
    })();

    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d', { willReadFrequently: true });
    const emptyEl  = document.getElementById('empty-state');
    const toastEl  = document.getElementById('toast');

    let originalImage = null;
    let isDrawing     = false;
    let currentMode   = 'pan';
    let startX = 0, startY = 0;
    let snapshot = null;
    let historyStack = [];
    let historyStep  = -1;
    let movingZoneIndex = -1;
    let zoneStartPos    = null;

    // 多图队列
    let imageQueue   = [];   // { dataUrl, editedData }
    let currentIndex = -1;

    /* ── Toast ── */
    let _toastTimer;
    function showToast(msg, duration = 2200) {
        clearTimeout(_toastTimer);
        toastEl.textContent = msg;
        toastEl.style.opacity = '1';
        _toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, duration);
    }

    /* ── 禁止层（水印排除区） ── */
    let excludeZones = [];  // [{x, y, w, h}, ...]

    function drawZoneOverlay(preview) {
        const svg = document.getElementById('zone-svg');
        if (!svg || !canvas.width) return;
        svg.setAttribute('viewBox', `0 0 ${canvas.width} ${canvas.height}`);
        const sw = Math.max(4, canvas.width / 200);
        const da = `${Math.max(12, canvas.width / 55)} ${Math.max(7, canvas.width / 90)}`;
        const fs = Math.max(24, canvas.width / 22);

        let html = excludeZones.map(z => {
            const lx = Math.min(z.x, z.x + z.w);
            const ly = Math.min(z.y, z.y + z.h);
            const lw = Math.abs(z.w);
            const lh = Math.abs(z.h);
            return `<g>
                <rect x="${lx}" y="${ly}" width="${lw}" height="${lh}"
                      fill="rgba(210,55,55,0.13)" stroke="#e05555" stroke-width="${sw}"
                      stroke-dasharray="${da}"/>
                <text x="${lx + lw/2}" y="${ly + lh/2}" font-size="${fs}"
                      fill="rgba(220,60,60,0.65)" text-anchor="middle"
                      dominant-baseline="middle" font-family="Jost,sans-serif">✕</text>
            </g>`;
        }).join('');

        if (preview) {
            const lx = Math.min(preview.x, preview.x + preview.w);
            const ly = Math.min(preview.y, preview.y + preview.h);
            const lw = Math.abs(preview.w);
            const lh = Math.abs(preview.h);
            html += `<rect x="${lx}" y="${ly}" width="${lw}" height="${lh}"
                           fill="rgba(210,55,55,0.08)" stroke="#e05555"
                           stroke-width="${sw}" stroke-dasharray="${da}" opacity="0.55"/>`;
        }
        svg.innerHTML = html;
        updateZoneUI();
    }

    function updateZoneUI() {
        const infoRow  = document.getElementById('zone-info-row');
        const countEl  = document.getElementById('zone-count');
        const tipEl    = document.getElementById('zone-tip');
        if (!infoRow) return;
        const show = (currentMode === 'zone' || excludeZones.length > 0);
        infoRow.style.display = show ? 'flex' : 'none';
        if (countEl) countEl.textContent = `${excludeZones.length} 个禁止层`;
        if (tipEl)   tipEl.style.display = currentMode === 'zone' ? 'inline' : 'none';
    }

    function addZone(x, y, w, h) {
        if (Math.abs(w) < 10 || Math.abs(h) < 10) return;
        excludeZones.push({ x, y, w, h });
        drawZoneOverlay();
        showToast(`已新增禁止层，共 ${excludeZones.length} 个`);
    }

    // 用这个函数替换掉原来的 removeZoneAt 函数
    function getZoneAt(px, py) {
        for (let i = excludeZones.length - 1; i >= 0; i--) {
            const z = excludeZones[i];
            const lx = Math.min(z.x, z.x + z.w);
            const ly = Math.min(z.y, z.y + z.h);
            const lw = Math.abs(z.w), lh = Math.abs(z.h);
            if (px >= lx && px <= lx + lw && py >= ly && py <= ly + lh) {
                return i;
            }
        }
        return -1;
    }

    function clearZones() {
        excludeZones = [];
        drawZoneOverlay();
        showToast("已清除全部禁止层");
    }

    /* ── 历史记录 ── */
    function saveState() {
        historyStep++;
        historyStack = historyStack.slice(0, historyStep);
        historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        updateUndoRedoUI();
    }
    function updateUndoRedoUI() {
        document.getElementById('btn-undo').disabled = historyStep <= 0;
        document.getElementById('btn-redo').disabled = historyStep >= historyStack.length - 1;
    }
    function undo() {
        if (historyStep > 0) { historyStep--; ctx.putImageData(historyStack[historyStep], 0, 0); updateUndoRedoUI(); }
    }
    function redo() {
        if (historyStep < historyStack.length - 1) { historyStep++; ctx.putImageData(historyStack[historyStep], 0, 0); updateUndoRedoUI(); }
    }

    /* ── 模式切换 ── */
    function switchMode(mode) {
        currentMode = mode;
        ['pan','box','brush','zone'].forEach(m => {
            const el = document.getElementById('mode-' + m);
            if (el) el.classList.remove('active');
        });
        document.getElementById('mode-' + mode).classList.add('active');
        const labels = { pan: "浏览模式", box: "拉框打码模式", brush: "涂抹打码模式", zone: "禁止层模式 — 拖动新增，点击删除" };
        showToast(labels[mode] || "");
        updateZoneUI();
    }

    /* ── 多图队列 ── */
    document.getElementById('upload').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        let loaded = 0;
        const startIdx = imageQueue.length;
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = ev => {
                imageQueue.push({ dataUrl: ev.target.result, editedData: null });
                loaded++;
                if (loaded === files.length) {
                    loadImageAtIndex(startIdx);
                    showToast(`已加入 ${files.length} 张，共 ${imageQueue.length} 张`);
                }
            };
            reader.readAsDataURL(file);
        });
        e.target.value = '';
    });

    function saveCurrentEdits() {
        if (currentIndex >= 0 && originalImage && canvas.width > 0)
            imageQueue[currentIndex].editedData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function loadImageAtIndex(index) {
        if (index < 0 || index >= imageQueue.length) return;
        saveCurrentEdits();
        currentIndex = index;
        const item = imageQueue[index];
        const img = new Image();
        img.onload = () => {
            originalImage = img;
            canvas.width  = img.width;
            canvas.height = img.height;
            if (item.editedData) {
                ctx.putImageData(item.editedData, 0, 0);
                historyStack = [item.editedData];
                historyStep  = 0;
            } else {
                ctx.drawImage(img, 0, 0);
                historyStack = []; historyStep = -1;
                saveState();
            }
            emptyEl.style.display = 'none';
            canvas.style.display  = 'block';
            updateNavUI();
            updateUndoRedoUI();
            switchMode('pan');
            document.getElementById('workspace').scrollTop = 0;
        };
        img.src = item.dataUrl;
    }

    function prevImage() { loadImageAtIndex(currentIndex - 1); }
    function nextImage() { loadImageAtIndex(currentIndex + 1); }

    function updateNavUI() {
        const nav    = document.getElementById('img-nav');
        const count  = document.getElementById('img-counter');
        const bPrev  = document.getElementById('btn-prev');
        const bNext  = document.getElementById('btn-next');
        const bAll   = document.getElementById('btn-export-all');

        if (imageQueue.length > 0) {
            nav.classList.add('on');
            const cur   = String(currentIndex + 1).padStart(2, '0');
            const total = String(imageQueue.length).padStart(2, '0');
            count.textContent   = `${cur} / ${total}`;
            bPrev.disabled      = currentIndex <= 0;
            bNext.disabled      = currentIndex >= imageQueue.length - 1;
            bAll.style.display  = imageQueue.length > 1 ? 'inline' : 'none';
        } else {
            nav.classList.remove('on');
            bAll.style.display = 'none';
        }
    }

    /* ── 批量导出（逐个下载） ── */
    async function exportAll() {
        if (imageQueue.length === 0) return showToast("没有图片可导出");
        saveCurrentEdits();

        const overlay  = document.getElementById('export-overlay');
        const bar      = document.getElementById('export-bar');
        const subLabel = document.getElementById('export-sub');
        overlay.classList.add('show');

        try {
            for (let i = 0; i < imageQueue.length; i++) {
                const item = imageQueue[i];
                subLabel.textContent = `正在导出 ${i + 1} / ${imageQueue.length}`;
                bar.style.width = `${((i) / imageQueue.length) * 100}%`;

                const tc  = document.createElement('canvas');
                const tcx = tc.getContext('2d');
                if (item.editedData) {
                    tc.width  = item.editedData.width;
                    tc.height = item.editedData.height;
                    tcx.putImageData(item.editedData, 0, 0);
                } else {
                    const img2 = await new Promise(res => {
                        const t = new Image(); t.onload = () => res(t); t.src = item.dataUrl;
                    });
                    tc.width  = img2.width;
                    tc.height = img2.height;
                    tcx.drawImage(img2, 0, 0);
                }
                
                // 将画布转为 Blob 并触发单张下载
                const blob = await new Promise(res => tc.toBlob(res, 'image/png', 1.0));
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `dama_${String(i+1).padStart(2,'0')}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                // 短暂延迟，防止浏览器判定为恶意弹窗而拦截批量下载
                await new Promise(res => setTimeout(res, 300));
            }

            bar.style.width = '100%';
            subLabel.textContent = '导出完成';
            showToast(`✓ 已逐个导出 ${imageQueue.length} 张图片`);
        } catch(err) {
            showToast("导出失败，请重试");
            console.error(err);
        } finally {
            setTimeout(() => {
                overlay.classList.remove('show');
                bar.style.width = '0%';
            }, 500);
        }
    }

    /* ── 单张导出 ── */
    function exportImage() {
        if (!originalImage) return showToast("还没有导入图片");
        const link = document.createElement('a');
        link.download = `dama_${String(currentIndex+1).padStart(2,'0')}.png`;
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
        showToast("✓ 导出成功");
    }

    /* ── 模糊核心 ── */
    function applyBlurToRect(rx, ry, rw, rh) {
        const xS = Math.max(0, Math.min(rx, rx+rw));
        const yS = Math.max(0, Math.min(ry, ry+rh));
        const xE = Math.min(canvas.width,  Math.max(rx, rx+rw));
        const yE = Math.min(canvas.height, Math.max(ry, ry+rh));
        const w  = xE-xS, h = yE-yS;
        if (w<=0||h<=0) return;

        const blurR = parseInt(document.getElementById('blur-radius').value);
        const pad   = blurR*2;
        const sx    = Math.max(0, xS-pad),   sy = Math.max(0, yS-pad);
        const sw    = Math.min(canvas.width, xE+pad)-sx;
        const sh    = Math.min(canvas.height,yE+pad)-sy;

        const tc  = document.createElement('canvas');
        tc.width  = sw; tc.height = sh;
        tc.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);

        ctx.save();
        ctx.beginPath(); ctx.rect(xS, yS, w, h); ctx.clip();
        ctx.filter = `blur(${blurR}px)`;
        ctx.drawImage(tc, sx, sy);
        ctx.restore();
    }

    /* ── 坐标换算 ── */
    function getEventPos(e) {
        const rect  = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        const cX = e.touches?.length ? e.touches[0].clientX : e.clientX;
        const cY = e.touches?.length ? e.touches[0].clientY : e.clientY;
        return { x: (cX - rect.left)*scaleX, y: (cY - rect.top)*scaleY };
    }

    /* ── 绘图事件 ── */
    function handleStart(e) {
        if (!originalImage || currentMode === 'pan') return;
        if (e.cancelable) e.preventDefault();
        isDrawing = true;
        const pos = getEventPos(e);
        startX = pos.x; startY = pos.y;
        
        if (currentMode === 'box') {
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        } else if (currentMode === 'zone') {
            // 检测是否点中了已有的禁止层
            const zIdx = getZoneAt(pos.x, pos.y);
            if (zIdx !== -1) {
                movingZoneIndex = zIdx;
                // 标准化宽高，方便后续计算坐标移动
                let z = excludeZones[zIdx];
                z.x = Math.min(z.x, z.x + z.w);
                z.y = Math.min(z.y, z.y + z.h);
                z.w = Math.abs(z.w);
                z.h = Math.abs(z.h);
                zoneStartPos = { x: pos.x, y: pos.y, origX: z.x, origY: z.y };
            } else {
                movingZoneIndex = -1;
            }
        } else {
            const sz = parseInt(document.getElementById('blur-radius').value)*3;
            applyBlurToRect(pos.x-sz/2, pos.y-sz/2, sz, sz);
        }
    }
    
    function handleMove(e) {
        if (!isDrawing || currentMode === 'pan') return;
        if (e.cancelable) e.preventDefault();
        const pos = getEventPos(e);
        
        if (currentMode === 'box') {
            ctx.putImageData(snapshot, 0, 0);
            ctx.save();
            ctx.strokeStyle = 'rgba(201,169,108,0.85)';
            ctx.lineWidth   = Math.max(3, canvas.width/350);
            ctx.setLineDash([8,6]);
            ctx.strokeRect(startX, startY, pos.x-startX, pos.y-startY);
            ctx.restore();
        } else if (currentMode === 'zone') {
            if (movingZoneIndex !== -1) {
                // 拖动已有禁止层
                const dx = pos.x - zoneStartPos.x;
                const dy = pos.y - zoneStartPos.y;
                excludeZones[movingZoneIndex].x = zoneStartPos.origX + dx;
                excludeZones[movingZoneIndex].y = zoneStartPos.origY + dy;
                drawZoneOverlay();
            } else {
                // 实时预览新禁止层的拖动范围
                drawZoneOverlay({ x: startX, y: startY, w: pos.x - startX, h: pos.y - startY });
            }
        } else {
            const sz = parseInt(document.getElementById('blur-radius').value)*3;
            applyBlurToRect(pos.x-sz/2, pos.y-sz/2, sz, sz);
        }
    }
    
    function handleEnd(e) {
        if (!isDrawing || currentMode === 'pan') return;
        isDrawing = false;
        
        if (currentMode === 'box') {
            ctx.putImageData(snapshot, 0, 0);
            const pos = getEventPos(e.changedTouches ? e.changedTouches[0] : e);
            applyBlurToRect(startX, startY, pos.x-startX, pos.y-startY);
            saveState();
        } else if (currentMode === 'zone') {
            const pos = getEventPos(e.changedTouches ? e.changedTouches[0] : e);
            
            if (movingZoneIndex !== -1) {
                // 结束移动
                const dx = pos.x - zoneStartPos.x;
                const dy = pos.y - zoneStartPos.y;
                // 核心逻辑：如果位移极小（小于5像素），判定为“轻点”，执行删除操作
                if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
                    excludeZones.splice(movingZoneIndex, 1);
                    showToast(`已删除禁止层，剩余 ${excludeZones.length} 个`);
                }
                movingZoneIndex = -1;
                drawZoneOverlay();
            } else {
                // 结束新增
                const w = pos.x - startX, h = pos.y - startY;
                if (Math.abs(w) >= 10 || Math.abs(h) >= 10) {
                    addZone(startX, startY, w, h);
                } else {
                    drawZoneOverlay(); // 清理残留的预览框
                }
            }
        } else {
            saveState();
        }
    }

    canvas.addEventListener('mousedown',  handleStart);
    canvas.addEventListener('mousemove',  handleMove);
    window.addEventListener('mouseup',    handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive:false});
    canvas.addEventListener('touchmove',  handleMove,  {passive:false});
    window.addEventListener('touchend',   handleEnd,   {passive:false});

    /* ── 水印 ── */
    function applyWatermark() {
        if (!originalImage) return showToast("请先导入图片");
        const fs = Math.max(16, Math.floor(canvas.width/24));
        ctx.save();
        ctx.font      = `bold ${fs}px 'Jost', sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(-30*Math.PI/180);
        const diag  = Math.sqrt(canvas.width**2 + canvas.height**2);
        const stepX = ctx.measureText("仅供展示  禁止盗图").width + 80;
        const stepY = fs * 4;
        for (let i=-diag; i<diag; i+=stepX)
            for (let j=-diag; j<diag; j+=stepY)
                ctx.fillText("仅供展示  禁止盗图", i, j);
        ctx.restore();
        saveState();
        showToast("已叠加防盗水印");
    }
</script>
</body>
